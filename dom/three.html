<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | CHAI AUR CODE </title>
</head>
<body style="background-color: #212121; color: #fff;">
    
</body>
<script>
    //hmko create krna hh div elemnt 
    const div = document.createElement('div')
    console.log(div) //yha pr div bngaya but console me dikh rha hh 
    //yha pr hm div ko class id assign kr rhe hh styel denge 
    div.className = "main"
    div.id = "myId"
    div.setAttribute("title","genrated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "chai aur code" // ye shi hh aise bhi kr skye hh

    const addText = document.createTextNode("chai aur code")
    div.appendChild(addText)

    document.body.appendChild(div)// yha pr div show hone lage ga 
    

</script>
</html>
